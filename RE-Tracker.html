const RET_SERVER = "http://192.168.29.252:3000";
// some phone file viewers block storage - fall back to memory so sign-in still works
try { localStorage.getItem('x'); } catch (e) {
  const m = {}; try { Object.defineProperty(window, 'localStorage', { configurable: true, value: { getItem: (k) => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: (k) => { delete m[k]; } } }); } catch (e2) { /* ignore */ }
}
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (a && !e.defaultPrevented) { e.preventDefault(); location.hash = a.getAttribute('href'); }
}, true);
window.addEventListener('error', (e) => { if (/Failed to fetch|NetworkError/i.test(String(e.message))) console.warn('Server not reachable:', RET_SERVER); });
</script>

<style>/* style.css */
:root {

* { box-sizing: border-box; }

a { color: var(--blue-2); }
.muted { color: var(--muted); } .small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }
.mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }

/* shell */
.app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
.side { background: var(--blue); color: #dfe8fb; padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }

/* controls */
.btn { border: 1px solid var(--line); background: #fff; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: #c4cddd; background: #fafbfe; } .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 1px; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.primary:hover { background: var(--blue-2); }
.btn.danger { color: var(--red); } .btn.sm { padding: 4px 9px; font-size: 12px; } .btn.ghost { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }

<script>/* app.js */
/* Retail Engineering Project Tracker - front end (vanilla JS) */
let S = null; // server state
let TOKEN = localStorage.getItem('ret_token') || '';
const $root = document.getElementById('root');
const ADMIN = () => S.me.role !== 'vendor'; // admin and view-only viewer use the full layout
const VIEWER = () => S.me.role === 'viewer';

/* ---------- utils ---------- */
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const P = (s) => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = P(s); d.setDate(d.getDate() + n); return iso(d); };
const nextWork = (s) => { const off = S?.settings?.weekOff || [0]; for (let i = 0; i < 7 && off.includes(P(s).getDay()); i++) s = addDays(s, 1); return s; };
const addWork = (s, n) => { s = nextWork(s); while (n > 0) { s = nextWork(addDays(s, 1)); n--; } return s; };
const fd = (s) => (s ? P(s).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : '-');
const fdy = (s) => (s ? P(s).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-');
const inr = (n) => (n == null ? '-' : '₹' + Number(n).toLocaleString('en-IN'));
const TYPE = { DU_REPLACEMENT: 'DU Replacement', RATIONALIZATION: 'Rationalization', STP_REPLACEMENT: 'STP Replacement' };
const TYPE_SHORT = { DU_REPLACEMENT: 'DU', RATIONALIZATION: 'RZ', STP_REPLACEMENT: 'STP' };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN }, body: body ? JSON.stringify(body) : undefined }).catch(() => { throw new Error('No internet connection. Please reconnect and try again.'); });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && TOKEN) { TOKEN = ''; localStorage.removeItem('ret_token'); S = null; render(); }
  if (r.status === 403 && j.mustChange) { FORCE_PW = true; render(); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3200);
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); return null; }
}
async function reload() { S = await api('GET', '/api/state'); }

/* ---------- lookups ---------- */
const outlet = (code) => S.outlets.find((o) => o.code === code) || { code, name: code };
const team = (id) => S.teams.find((t) => t.id === id);
const vendor = (id) => S.vendors.find((v) => v.id === id);
const jobById = (id) => S.jobs.find((j) => j.id === id);
const stages = (j) => S.stages[j.type].filter((s) => s.key !== 'cabling' || j.cabling === 'Required');
const sIdx = (j, key = j.stage) => stages(j).findIndex((s) => s.key === key);
const sLabel = (j, key = j.stage) => stages(j).find((s) => s.key === key)?.label || key;
const pct = (j) => Math.round((sIdx(j) / (stages(j).length - 1)) * 100);
const doneKey = (j) => (j.type === 'RATIONALIZATION' ? 'dismantled' : 'commissioned');
const finished = (j) => sIdx(j) >= sIdx(j, doneKey(j));
const overdue = (j) => j.due && j.due < S.today && !finished(j);
function stagePill(j) {
  const i = sIdx(j), n = stages(j).length;
  const c = j.stage === 'closed' ? 'green' : finished(j) ? 'green' : i >= sIdx(j, 'deployed') ? 'blue' : i === 0 ? '' : 'amber';
  return `<span class="pill ${c}">${h(sLabel(j))}</span>`;
}
const dur = (j) => {
  if (j.daysOverride > 0) return j.daysOverride;
  const dr = outlet(j.outletCode).driveway === 'RCC' ? 'RCC' : 'Paver';
  const d = S.settings?.durations?.[j.type]?.[dr] || 2;
  const qty = j.type === 'STP_REPLACEMENT' ? j.stpQty : j.type === 'RATIONALIZATION' ? j.oldQty : j.newQty;
  return Math.max(1, Math.ceil(d * Math.max(1, qty || 1) / 2)) + (j.cabling === 'Required' ? S.settings?.cablingDays || 0 : 0);
};
const needs = (j) => [j.newQty > 0 && j.newModel && { kind: 'DU', model: j.newModel, qty: j.newQty }, j.stpQty > 0 && j.stpModel && { kind: 'STP', model: j.stpModel, qty: j.stpQty }].filter(Boolean);
const availOf = (kind, model, src = 'New') => S.stock.filter((r) => r.kind === kind && r.model === model && (src === 'Reuse' ? r.cond === 'Reusable' : r.cond === 'New' || r.cond === 'Refurbished')).reduce((a, r) => a + r.qty - r.reserved, 0);

const ICON = {
  rupee: '<path d="M6 4h12M6 9h12M9 4c6 0 6 5 0 5l7 11"/>',
  hook: '<path d="M12 3v9a4 4 0 108 0M12 3H9m3 0h3M8 21h8"/>',
  du: '<rect x="6" y="3" width="12" height="18" rx="2"/><rect x="9" y="6" width="6" height="5"/><path d="M9 15h6"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/>', store: '<path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M9 20v-6h6v6"/>',
  dash: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>', jobs: '<path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/>',
  time: '<path d="M3 6h12M3 12h18M3 18h9"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>', team: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-1.5-5-4-5.6"/>',
  pin: '<path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>', mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', cog: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14 3h-4l-.6 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 002 1.2L10 21h4l.6-2.6a7 7 0 002-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>',
};
const ico = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* ---------- modal ---------- */
function modal(html, { side = false } = {}) {
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay' + (side ? '' : ' center'); o.id = 'modal';
  o.innerHTML = `<div class="panel" role="dialog" aria-modal="true"><button class="btn sm x" onclick="closeModal()" aria-label="Close">✕ Close</button>${html}</div>`;
  o.addEventListener('mousedown', (e) => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal() { document.getElementById('modal')?.remove(); }
const val = (id) => document.getElementById(id)?.value;
const chk = (id) => document.getElementById(id)?.checked;
const opts = (list, sel, blank) => (blank ? `<option value="">${h(blank)}</option>` : '') + list.map(([v, l]) => `<option value="${h(v)}" ${v === sel ? 'selected' : ''}>${h(l)}</option>`).join('');

/* ---------- login ---------- */
function loginView() {
  $root.innerHTML = `<div class="login"><form class="box" id="lf">
    ${brandHtml(true)}
    <h2 style="margin-bottom:14px">Sign in</h2>
    <div class="field"><label>Username</label><input id="lu" autocomplete="username" autofocus></div>
    <div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%;padding:10px">Sign in</button>
    <div class="hint"><b>Draft demo logins</b><br>Admin: <span class="mono">admin / admin123</span><br>Vendor: <span class="mono">alpha / vendor123</span> (also bharat, crest)</div></form></div>`;
  document.getElementById('lf').onsubmit = async (e) => {
    e.preventDefault();
    const r = await act(() => api('POST', '/api/login', { username: val('lu'), password: val('lp') }));
    if (r) { TOKEN = r.token; localStorage.setItem('ret_token', TOKEN); if (r.mustChange) { FORCE_PW = true; return render(); } await boot(); }
  };
}

/* ---------- shell ---------- */
const NAV_ADMIN = [['#', 'Overview'], ['dash', 'Monitoring dashboard', 'dash'], ['map', 'Live map', 'map'], ['#', 'Work'], ['jobs', 'Jobs', 'jobs'], ['timeline', 'Timeline', 'time'], ['teams', 'Vendors & Teams', 'team'], ['outlets', 'Outlets', 'store'], ['#', 'Stores'], ['inventory', 'Inventory', 'box'], ['hardware', 'Hanging hardware', 'hook'], ['assets', 'Installed DUs', 'du'], ['scrap', 'Scrap', 'trash'], ['#', 'Money & mail'], ['billing', 'Billing', 'rupee'], ['emails', 'Mail log', 'mail'], ['settings', 'Settings', 'cog']];
const NAV_VENDOR = [['#', 'Overview'], ['dash', 'My overview', 'dash'], ['map', 'Live map', 'map'], ['#', 'Work'], ['jobs', 'My jobs', 'jobs'], ['timeline', 'My schedule', 'time'], ['scrap', 'Scrap', 'trash'], ['#', 'Money'], ['billing', 'Billing', 'rupee'], ['settings', 'Account', 'cog']];
const view = () => (location.hash.slice(1) || 'dash').split('/')[0];

function render() {
  if (typeof applyTheme === 'function') applyTheme();
  if (typeof FORCE_PW !== 'undefined' && FORCE_PW && TOKEN) return forcePwView();
  try { if (typeof MAPOBJ !== 'undefined' && MAPOBJ?.kind === 'l') MAPOBJ.map.remove(); } catch { /* map already gone */ }
  if (!S) return loginView();
  const nav = ADMIN() ? NAV_ADMIN : NAV_VENDOR.filter(([k]) => S.settings.vendorMenu?.[k] !== false), v = view();

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const hd = rows.shift().map((x) => x.trim());
  return rows.filter((r) => r.some((x) => x.trim())).map((r) => Object.fromEntries(hd.map((k, i) => [k, (r[i] || '').trim()])));
}

const b64 = (blob) => new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(blob); });
async function prepFile(file) {
  if (file.type === 'application/pdf') return { mime: file.type, data: await b64(file) };
  const img = await createImageBitmap(file);
  const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
  return { mime: 'image/jpeg', data: await b64(blob) };
}

    catch (e) { toast(`${f.name}: ${e.message}`, true); }

  await reload(); refreshFiles(stage, kind);
}
function refreshFiles(stage, kind) {

function mapStatus(j) {

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load map library — check internet connection')); document.head.appendChild(s); }); }
async function ensureMapLib() {

    if (!window.google?.maps) await new Promise((res, rej) => { window.__gmInit = res; const s = document.createElement('script'); s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__gmInit`; s.onerror = () => rej(new Error('Could not load Google Maps')); document.head.appendChild(s); });
    if (!HtmlMarker) HtmlMarker = class extends google.maps.OverlayView {
      constructor(pos, el) { super(); this.pos = new google.maps.LatLng(pos.lat, pos.lng); this.el = el; }
      onAdd() { this.el.style.position = 'absolute'; this.getPanes().overlayMouseTarget.appendChild(this.el); }
      draw() { const p = this.getProjection().fromLatLngToDivPixel(this.pos); if (p) { this.el.style.left = p.x - this.el.offsetWidth / 2 + 'px'; this.el.style.top = p.y - this.el.offsetHeight / 2 + 'px'; } }

    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);

}
function clearLines() { const m = MAPOBJ; if (!m) return; m.lines.forEach((l) => (m.kind === 'g' ? l.setMap(null) : l.remove())); m.lines = []; }

function vInventory() {
  const main = S.stock.filter((r) => r.cond !== 'Reusable'), pool = S.stock.filter((r) => r.cond === 'Reusable');
  const free = (rows, k, conds) => rows.filter((r) => r.kind === k && conds.includes(r.cond)).reduce((a, r) => a + r.qty - r.reserved, 0);
  const res = (k) => main.filter((r) => r.kind === k).reduce((a, r) => a + r.reserved, 0);
  const on = (rows, cond) => rows.filter((r) => r.cond === cond).reduce((a, r) => a + r.qty, 0);
  const dem = {};
  const addDem = (j, kind, model, q) => { const k = `${j.source === 'Reuse' ? 'Reuse' : 'New'}|${kind}|${model}`; dem[k] = (dem[k] || 0) + q; };
  for (const j of S.jobs) if (!j.teamId && sIdx(j) < sIdx(j, 'deployed')) for (const n of needs(j)) addDem(j, n.kind, n.model, n.qty);
  for (const j of S.jobs) for (const s of j.shortage || []) addDem(j, s.kind, s.model, s.qty);
  const dr = Object.entries(dem).map(([k, q]) => { const [src, kind, model] = k.split('|'); const a = availOf(kind, model, src); return { src, kind, model, q, a, gap: Math.max(0, q - a) }; });
  const tbl = (rows) => rows.map((r) => `<tr><td><span class="pill ${r.kind === 'DU' ? 'blue' : ''}">${r.kind}</span></td><td>${h(r.model)}<div class="small muted">${h([r.make, r.nozzles ? r.nozzles + ' nozzle' : '', r.hp ? r.hp + ' HP' : ''].filter(Boolean).join(' · '))}${(r.units || []).length ? ` · <a href="#" onclick="showStockUnits('${r.id}');return false">${r.units.filter((u) => u.status !== 'Installed').length} serial no(s)</a>` : ''}</div></td><td><span class="pill ${r.cond === 'New' || r.cond === 'Reusable' ? 'green' : r.cond === 'Scrap' ? 'red' : 'amber'}">${h(r.cond)}</span></td><td>${h(r.store)}</td><td class="right">${r.qty}</td><td class="right">${r.reserved}</td><td class="right"><b>${r.qty - r.reserved}</b></td><td class="right"><button class="btn sm" onclick="adjStock('${r.id}')">Adjust</button>${S.me.role === 'admin' ? ` <button class="btn sm danger" onclick="delStock('${r.id}')">Delete</button>` : ''}</td></tr>`).join('');
  const head = '<thead><tr><th>Type</th><th>Model</th><th>Condition</th><th>Store</th><th class="right">On hand</th><th class="right">Reserved</th><th class="right">Free</th><th></th></tr></thead>';

async function runExcel() {

  const btn = document.getElementById('xl_go'); btn.disabled = true; btn.textContent = 'Importing…';
  try {
    const payload = []; for (const f of files) payload.push({ name: f.name, data: await readB64(f) });
    const r = await api('POST', '/api/import/excel', { files: payload });
    document.getElementById('xl_res').innerHTML = `<div class="callout"><b>Import finished</b><ul class="small" style="margin:8px 0 0 18px;line-height:1.7">${r.files.map((x) => `<li>${h(x.name)} — ${x.kind ? '<span class="pill green">' + h(x.kind) + '</span>' : '<span class="pill red">' + h(x.error) + '</span>'}</li>`).join('')}</ul>
      <div class="small" style="margin-top:8px">Outlets: <b>${r.outlets.added}</b> new, <b>${r.outlets.updated}</b> updated · Installed units: <b>${r.assets.added}</b> new, <b>${r.assets.updated}</b> updated · Jobs created: <b>${r.jobs.created}</b>${r.jobs.skipped ? ` (${r.jobs.skipped} already existed)` : ''}</div></div>
      ${r.notes.length ? `<div class="callout warn small"><b>Please review</b><ul style="margin:6px 0 0 18px">${r.notes.map((n) => `<li>${h(n)}</li>`).join('')}</ul></div>` : ''}`;
    await reload(); ASSETS = null;
  } catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = 'Import';
}

/* ---------- installed DU / STP register ---------- */
let ASSETS = null; const AF = { q: '', kind: 'DU', pump: 'Suction', area: '', status: 'Active', make: '' };
window.after_assets = async () => { if (!ASSETS) ASSETS = await api('GET', '/api/assets').catch(() => []); drawAssets(); };
async function delAsset(id) { const a = ASSETS?.find((x) => x.id === id); delAssetAsk(id, a); }
async function delAssetGo(id) { const sc = chk('da_sc'); const r = await act(() => api('DELETE', '/api/assets/' + id + '?scrap=' + (sc ? 1 : 0)), sc ? 'Unit deleted — moved to Scrap DUs at its outlet' : 'Unit deleted'); if (r) { ASSETS = null; closeModal(); refresh(); } }
async function planSuction() {
  const st = S.assetStats, n = (st.suction ?? 0) - (st.suctionPlanned ?? 0);
  if (n <= 0) return toast('All suction DUs are already in a job');
  const y = prompt(`${n} suction DUs are not in any job yet.\nCreate replacement jobs (one per outlet, Low priority, no vendor) for units manufactured up to which year? Leave blank for all.`, '');
  if (y === null) return;
  const r = await act(() => api('POST', '/api/assets/plan-suction', { maxYear: y }), null); if (!r) return;
  toast(`${r.created} job(s) created${r.skippedNoOutlet ? `, ${r.skippedNoOutlet} skipped (outlet not mapped)` : ''}`); ASSETS = null; refresh();
}

/* ---------- map engine (shared by work map and scrap map) ---------- */
let MAPTOK = 0;
async function mountMap(id) {
  const m = await buildMap(id); if (!m) return;
  const pts = mapPoints(), have = new Set(pts.map((p) => p.o.code));
  const click = (code) => () => (document.getElementById('map_side') ? selectOutlet(code) : (() => { const p = pts.find((x) => x.o.code === code); if (p) openJob(p.job.id); })());
  if (SHOWALL) for (const o of S.outlets) if (o.lat != null && !have.has(o.code)) { const d = document.createElement('div'); d.className = 'pm dot'; d.title = `${o.name} — no active work`; m.add(o.lat, o.lng, d, () => toast(o.name + ' — no active work'), 'o' + o.code); }
  for (const p of pts) m.add(p.o.lat, p.o.lng, pmEl(p), click(p.o.code), p.o.code);
  m.fit(pts.map((p) => [p.o.lat, p.o.lng]));
  if (MAPSEL && document.getElementById('map_side')) drawNextLines();
}

/* ---------- scrap section ---------- */
let SCRAPTAB = 'list', SCRAPSEL = null; const SF = { status: 'At outlet', cat: '', q: '' };
const scrapUrl = (x, f) => `/api/scrapfiles/${x.id}/${f.id}?t=${encodeURIComponent(TOKEN)}`;
window.after_scrap = () => { if (SCRAPTAB === 'map') { mountScrapMap('scrap_map'); renderScrapSide(); } };
function scrapPhotos(x) { return x.files.map((f) => `<div class="ph"><img src="${scrapUrl(x, f)}" loading="lazy" alt="" onclick="window.open(this.src)"></div>`).join(''); }
async function uploadScrapFiles(id, files) {
  for (const f of files) { try { const p = await prepFile(f); await api('POST', `/api/scrap/${id}/files`, { name: f.name, mime: p.mime, data: p.data }); } catch (e) { toast(`${f.name}: ${e.message}`, true); } }
}
function addScrapPhotos(id) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = async () => { await uploadScrapFiles(id, [...inp.files]); await refresh(); }; inp.click();
}
async function setScrapStatus(id, status) { const r = await act(() => api('PATCH', '/api/scrap/' + id, { status }), 'Updated'); if (r) refresh(); }
async function delScrap(id) { if (confirm('Delete this scrap item and its photos?')) { const r = await act(() => api('DELETE', '/api/scrap/' + id), 'Deleted'); if (r) refresh(); } }


</script>
<script>/* features3.js */
/* Features layer 3: HPCL branding + theme, new dashboard, sales-area map colours, jobs with photos & work permit,
   hanging hardware, teams (two members), legacy 2011-13 DU tile, tabbed settings. Loaded after features2.js. */

/* ---------- branding, theme, area colours ---------- */
const AREA_FALLBACK = '#8d99ae';
const areaColor = (a) => S?.settings?.areaColors?.[String(a || '').toLowerCase()] || AREA_FALLBACK;
const salesAreas = () => [...new Set(S.outlets.map((o) => o.salesArea).filter(Boolean))].sort();
function applyTheme() {
  const t = S?.settings?.theme, r = document.documentElement.style;
  if (t?.blue) r.setProperty('--blue', t.blue); if (t?.red) r.setProperty('--red', t.red);
}
function brandHtml(dark) {
  const b = S?.settings?.brand || { title: 'Retail Engineering', subtitle: 'Project Tracker', org: 'HPCL' }, v = S?.settings?.logoV || 0;
  return `<div class="brand ${dark ? 'dark' : ''}" style="${dark ? 'padding:0 0 18px' : ''}"><div class="logo"><img src="/brand/logo?v=${v}" alt="Hindustan Petroleum logo"></div>
    <div><span class="org">${h(b.org)}</span><span class="sub">${h(b.title)} · ${h(b.subtitle)}</span></div></div>`;
}

/* ---------- map markers coloured by sales area, with outlet name ---------- */
function pmEl(p) {
  const w = document.createElement('div'), d = document.createElement('div'), c = areaColor(p.o.salesArea), pc = p.st === 'done' ? 100 : pct(p.job);
  w.className = 'pmw' + (MAPSEL === p.o.code ? ' sel' : ''); w.title = `${p.o.name} · ${p.o.salesArea || ''} · ${p.job.ref} · ${sLabel(p.job)}`;
  d.className = 'pm' + (p.st === 'live' || p.st === 'late' ? ' live' : ''); d.style.background = `conic-gradient(${c} ${pc * 3.6}deg, ${c}40 0)`; d.style.boxShadow = `0 0 0 2.5px ${c}, 0 2px 8px rgba(0,0,0,.35)`;
  d.innerHTML = `<span class="in">${p.st === 'done' ? '✓' : pc + '%'}</span><i class="bdg" style="background:${MSTAT[p.st].c}"></i>`;
  const l = document.createElement('span'); l.className = 'pml'; l.textContent = p.o.name; l.style.borderColor = c;
  w.append(d, l); return w;
}
function mapLegend() {
  const pts = mapPoints(), by = {}; pts.forEach((p) => (by[p.o.salesArea || '—'] = (by[p.o.salesArea || '—'] || 0) + 1));
  return `<div class="legend">${Object.entries(by).sort().map(([a, n]) => `<span>${dot(areaColor(a))}${h(a)} (${n})</span>`).join('')}</div>
    <div class="legend" style="margin-top:-4px"><span class="muted">Ring colour = sales area · badge:</span>${Object.entries(MSTAT).map(([k, v]) => `<span><i style="background:${v.c}"></i>${v.l}</span>`).join('')}</div>`;
}
const dot = (c) => `<i class="adot" style="background:${c}"></i>`;

/* ---------- dashboard ---------- */

/* ---------- jobs: progress + photos + work permit ---------- */
let JV = 'table';
const photoList = (j) => (j.files || []).filter((f) => f.kind === 'photo').sort((a, b) => b.at.localeCompare(a.at));
const thumb = (j, f) => `<img class="th" src="${fileUrl(j, f)}" loading="lazy" decoding="async" alt="" title="${h(sLabel(j, f.stage))}" onclick="event.stopPropagation();window.open(this.src)">`;
function permitPill(j) {
  const ok = j.permit?.status === 'Issued';
  return `<span class="pill ${ok ? 'green' : 'amber'}" ${ADMIN() ? `style="cursor:pointer" onclick="event.stopPropagation();editPermit('${j.id}')"` : ''} title="Work permit${ok && j.permit.date ? ' issued ' + fdy(j.permit.date) : ''}">${ok ? 'Permit ✓' : 'No permit'}</span>`;
}
function jobTable(list) {
  if (!list.length) return '<div class="empty">No jobs match</div>';
  return `<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Outlet</th><th>Stage · permit</th><th>Progress</th><th>Photos</th><th>Vendor / Team</th><th>Planned</th><th>Due</th></tr></thead><tbody>${list.map((j) => {
    const o = outlet(j.outletCode), ph = photoList(j), pc = pct(j);
    return `<tr class="click" onclick="openJob('${j.id}')"><td class="nowrap"><b>${h(j.ref)}</b><div class="small muted">${h(TYPE[j.type])}</div></td>
      <td>${dot(areaColor(o.salesArea))}<b>${h(o.name)}</b><div class="small muted"><span class="mono">${h(j.outletCode)}</span> · ${h(o.salesArea || '')}${o.driveway === 'RCC' ? ' · <span class="pill amber">RCC</span>' : ''}${j.cabling === 'Required' ? ' <span class="pill">Cabling</span>' : ''}</div></td>
      <td>${stagePill(j)}${j.priority === 'High' ? ' <span class="pill red">High</span>' : ''}<div style="margin-top:3px">${permitPill(j)} ${autoPill(j)}</div></td>
      <td style="min-width:110px"><div class="bar"><i style="width:${pc}%;background:${areaColor(o.salesArea)}"></i></div><div class="small muted">${pc}%</div></td>
      <td class="nowrap">${ph.slice(0, 3).map((f) => thumb(j, f)).join('')}${ph.length > 3 ? `<span class="small muted"> +${ph.length - 3}</span>` : ph.length ? '' : '<span class="muted small">—</span>'}</td>
      <td class="small">${h(vendorName(jobVendor(j)) || '-')}${j.teamId ? '<br><span class="muted">' + h(team(j.teamId)?.name) + '</span>' : ''}</td><td class="small nowrap">${j.plannedStart ? fd(j.plannedStart) + ' – ' + fd(j.plannedEnd) : '-'}</td>
      <td class="small nowrap" style="${overdue(j) ? 'color:var(--red);font-weight:700' : ''}">${fd(j.due)}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function jobCards(list) {
  if (!list.length) return '<div class="empty">No jobs match</div>';
  return `<div class="jcards">${list.map((j) => {
    const o = outlet(j.outletCode), c = areaColor(o.salesArea), ph = photoList(j), pc = pct(j);
    return `<div class="jcard" style="border-top:4px solid ${c}" onclick="openJob('${j.id}')"><div class="t"><b>${h(o.name)}</b>${permitPill(j)}</div><div class="small muted">${h(j.ref)} · ${h(TYPE[j.type])} · ${h(o.salesArea || '')}</div>
      <div class="row" style="margin:8px 0 4px">${stagePill(j)}<b>${pc}%</b></div><div class="bar"><i style="width:${pc}%;background:${c}"></i></div><div class="small muted" style="margin:5px 0 8px">${h(runText(j))}</div>
      ${ph.length ? `<div class="strip">${ph.slice(0, 8).map((f) => thumb(j, f)).join('')}</div><div class="small muted">${ph.length} photo(s) · latest: ${h(sLabel(j, ph[0].stage))}</div>` : '<div class="small muted">No photos yet</div>'}</div>`;
  }).join('')}</div>`;
}
function filteredJobs() {
  const f = JF, q = (f.q || '').toLowerCase();
  return S.jobs.filter((j) => {
    const o = outlet(j.outletCode);
    if (f.type && j.type !== f.type) return false; if (f.area && o.salesArea !== f.area) return false; if (f.vendor && jobVendor(j) !== f.vendor) return false;
    if (f.permit === 'no' && j.permit?.status === 'Issued') return false; if (f.permit === 'yes' && j.permit?.status !== 'Issued') return false;
    if (q && !`${j.ref} ${o.name} ${j.outletCode} ${o.district} ${o.salesArea}`.toLowerCase().includes(q)) return false;
    const s = f.stage || 'active';
    if (s === 'active') return j.stage !== 'closed'; if (s === 'overdue') return overdue(j); if (s === 'unsched') return !j.teamId && sIdx(j) < sIdx(j, 'deployed');
    if (s === 'field') return j.teamId && sIdx(j) >= sIdx(j, 'deployed') && !finished(j); if (s === 'done') return finished(j);
    return true;
  }).sort((a, b) => (a.due || '9').localeCompare(b.due || '9'));
}
function vJobs() {
  return `<div class="head"><div><h1>${ADMIN() ? 'Jobs' : 'My jobs'}</h1><p>Progress, site photos and work-permit status of every outlet. Click a row for details and updates.</p></div>
    <div class="row"><div class="seg"><button class="${JV === 'table' ? 'on' : ''}" onclick="JV='table';render()">Table</button><button class="${JV === 'cards' ? 'on' : ''}" onclick="JV='cards';render()">Cards with photos</button></div>${ADMIN() ? `<button class="btn" onclick="importJobs()">Import CSV</button><button class="btn primary" onclick="editJob()">+ New job</button>` : ''}</div></div>
  <div class="filters"><input type="search" id="f_q" placeholder="Search outlet, code, ref…" value="${h(JF.q || '')}" oninput="setJF()">
   <select id="f_type" onchange="setJF()">${opts(Object.entries(TYPE), JF.type, 'All work types')}</select>
   <select id="f_stage" onchange="setJF()">${opts([['active', 'Active (not closed)'], ['overdue', 'Overdue'], ['unsched', 'Not scheduled'], ['field', 'In field'], ['done', 'Completed'], ['all', 'Everything']], JF.stage || 'active')}</select>
   <select id="f_area" onchange="setJF()">${opts(salesAreas().map((r) => [r, r]), JF.area, 'All sales areas')}</select>
   <select id="f_permit" onchange="setJF()">${opts([['no', 'Permit not issued'], ['yes', 'Permit issued']], JF.permit, 'Any permit status')}</select>
   ${ADMIN() ? `<select id="f_vendor" onchange="setJF()">${opts(S.vendors.map((v) => [v.id, v.name]), JF.vendor, 'All vendors')}</select>` : ''}</div>
  <div id="jobs_list">${JV === 'cards' ? jobCards(filteredJobs()) : jobTable(filteredJobs())}</div>`;
}
function setJF() {
  Object.assign(JF, { q: val('f_q'), type: val('f_type'), stage: val('f_stage'), area: val('f_area'), permit: val('f_permit'), vendor: val('f_vendor') });
  sessionStorage.setItem('jf', JSON.stringify(JF));
  document.getElementById('jobs_list').innerHTML = JV === 'cards' ? jobCards(filteredJobs()) : jobTable(filteredJobs());
}

/* ---------- hanging hardware ---------- */
let HHTAB = 'issues'; const HF = { q: '', date: '' };
const hhLabel = (k) => S.hh.items.find((i) => i.key === k)?.label || k;
const hhUrl = (i, f) => `/api/hhfiles/${i.id}/${f.id}?t=${encodeURIComponent(TOKEN)}`;
function vHardware() {
  const today_ = S.hh.issues.filter((i) => !i.cancelled && i.date === S.today), outsToday = new Set(today_.flatMap((i) => i.lines.map((l) => l.outletCode))).size;
  const tot = Object.values(S.hh.stock).reduce((a, b) => a + b, 0);
  return `<div class="head"><div><h1>Hanging hardware</h1><p>Hoses, swivel joints, breakaway couplings, spouts, reducers and sample seals — stock and daily issue to outlets (with FSE report and dealer letter).</p></div><div class="row"><button class="btn" onclick="receiveHH()">+ Receive stock</button><button class="btn primary" onclick="issueHH()">Issue to outlet(s)</button></div></div>
  ${hhStrip().replace('margin-top:16px', 'margin-top:0')}
  <div class="kpis" style="margin-top:16px"><div class="kpi"><b>${tot}</b><span>Items in stock (all types)</span></div><div class="kpi green"><b>${today_.length}</b><span>Issues today</span></div><div class="kpi"><b>${outsToday}</b><span>Outlets served today</span></div><div class="kpi amber"><b>${S.hh.items.filter((i) => i.min > 0 && (S.hh.stock[i.key] || 0) <= i.min).length}</b><span>Items at low stock</span></div></div>
  <div class="tabs"><button class="${HHTAB === 'issues' ? 'on' : ''}" onclick="HHTAB='issues';render()">Issues</button><button class="${HHTAB === 'ledger' ? 'on' : ''}" onclick="HHTAB='ledger';render()">Stock ledger</button></div>
  ${HHTAB === 'issues' ? `<div class="filters"><input type="search" id="hf_q" placeholder="Search outlet, issue no…" value="${h(HF.q)}" oninput="HF.q=this.value;drawHH()"><input type="date" id="hf_d" value="${HF.date}" onchange="HF.date=this.value;drawHH()"><button class="btn sm" onclick="HF.date=S.today;render()">Today</button><button class="btn sm" onclick="HF.date='';HF.q='';render()">All</button></div><div id="hh_list">${hhIssueTable()}</div>`
    : `<div class="tbl-wrap" style="max-height:60vh;overflow:auto"><table><thead><tr><th>Date</th><th>Movement</th><th>Item</th><th class="right">Qty</th><th>Reference</th><th>By</th></tr></thead><tbody>${S.hh.moves.map((m) => `<tr><td class="small nowrap">${fd(m.date)}</td><td><span class="pill ${m.type === 'ISSUE' ? 'amber' : m.type === 'RECEIVE' ? 'green' : ''}">${m.type}</span></td><td>${h(hhLabel(m.key))}</td><td class="right"><b>${m.qty > 0 ? '+' : ''}${m.qty}</b></td><td class="small">${h(m.ref)}</td><td class="small">${h(m.by)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No movements yet</td></tr>'}</tbody></table></div>`}`;
}
function drawHH() { const el = document.getElementById('hh_list'); if (el) el.innerHTML = hhIssueTable(); }
function hhIssueTable() {
  const q = HF.q.toLowerCase();
  const list = S.hh.issues.filter((i) => (!HF.date || i.date === HF.date) && (!q || `${i.no} ${i.lines.map((l) => l.outletCode + ' ' + outlet(l.outletCode).name).join(' ')}`.toLowerCase().includes(q)));
  return `<div class="tbl-wrap"><table><thead><tr><th>Issue</th><th>Date</th><th>Outlets & items</th><th>FSE report</th><th>Dealer letter</th><th>By</th><th></th></tr></thead><tbody>${list.map((i) => {
    const by = {}; i.lines.forEach((l) => (by[l.outletCode] ||= []).push(`${l.qty} × ${hhLabel(l.key)}`));
    return `<tr class="${i.cancelled ? 'cancelled' : ''}"><td class="nowrap"><b>${h(i.no)}</b>${i.cancelled ? '<br><span class="pill red">cancelled</span>' : ''}</td><td class="small nowrap">${fd(i.date)}</td>
     <td class="small">${Object.entries(by).map(([c, it]) => `<div>${dot(areaColor(outlet(c).salesArea))}<b>${h(outlet(c).name)}</b> <span class="muted">${h(c)}</span><br><span class="muted">${it.map(h).join(', ')}</span></div>`).join('')}${i.note ? `<div class="muted">${h(i.note)}</div>` : ''}</td>
     <td class="small">${i.fseRef ? h(i.fseRef) + '<br>' : ''}${i.fse.map((f, n) => `<a href="${hhUrl(i, f)}" target="_blank" rel="noopener">File ${n + 1}</a>`).join(' · ')}</td><td class="small">${i.dealerRef ? h(i.dealerRef) + '<br>' : ''}${i.dealer.map((f, n) => `<a href="${hhUrl(i, f)}" target="_blank" rel="noopener">File ${n + 1}</a>`).join(' · ')}</td>
     <td class="small">${h(i.by)}</td><td class="right">${i.cancelled ? '' : `<button class="btn sm danger" onclick="cancelHH('${i.id}')">Cancel</button>`}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">No issues for this filter</td></tr>'}</tbody></table></div>`;
}
function receiveHH() {
  modal(`<h1>Receive hanging hardware</h1><div class="grid2"><div class="field"><label>Item</label><select id="hr_k">${opts(S.hh.items.map((i) => [i.key, `${i.label} (stock ${S.hh.stock[i.key] || 0})`]), '')}</select></div><div class="field"><label>Quantity *</label><input id="hr_q" type="number" min="1"></div>
   <div class="field"><label>Date</label><input id="hr_d" type="date" value="${S.today}"></div><div class="field"><label>Reference (PO / challan)</label><input id="hr_r"></div></div><button class="btn primary" onclick="saveReceiveHH()">Add to stock</button>`);
}
async function saveReceiveHH() { const r = await act(() => api('POST', '/api/hh/receive', { key: val('hr_k'), qty: val('hr_q'), date: val('hr_d'), ref: val('hr_r') }), 'Stock added'); if (r) { closeModal(); refresh(); } }
function issueHH() {
  modal(`<h1>Issue hanging hardware</h1>
   <div class="card" style="padding:10px 12px;margin-bottom:12px"><h3 style="margin-bottom:6px">Current stock</h3><div class="hh-tiles sm">${S.hh.items.map((i) => `<div class="hh-tile ${(S.hh.stock[i.key] || 0) <= (i.min || 0) && i.min > 0 ? 'low' : ''}"><b>${S.hh.stock[i.key] || 0}</b><span>${h(i.label)}</span></div>`).join('')}</div></div>
   <div class="grid2"><div class="field"><label>Issue date</label><input id="hi_d" type="date" value="${S.today}" max="${S.today}"></div><div class="field"><label>Note</label><input id="hi_n" placeholder="optional"></div></div>
   <h3>Outlets, items and quantities</h3><div id="hi_lines"></div><datalist id="dl_hho">${S.outlets.map((o) => `<option value="${h(outletLabel(o))}">`).join('')}</datalist>
   <div class="row" style="margin:8px 0 14px"><button class="btn sm" onclick="addHHLine()">+ Add line (next outlet / item)</button></div>
   <div class="grid2"><div class="field"><label>Field Service Engineer report — ref no.</label><input id="hi_fr"></div><div class="field"><label>FSE report file(s) * (photo / PDF)</label><input type="file" id="hi_ff" accept="image/*,application/pdf" multiple></div>
   <div class="field"><label>Dealer letter — ref / date</label><input id="hi_dr"></div><div class="field"><label>Dealer letter file(s) * (photo / PDF)</label><input type="file" id="hi_df" accept="image/*,application/pdf" multiple></div></div>
   <button class="btn primary" id="hi_go" onclick="saveHH()">Issue stock</button>`);
  addHHLine();
}
function addHHLine() {
  const box = document.getElementById('hi_lines'), prev = box.lastElementChild, row = document.createElement('div'); row.className = 'hhline';
  row.innerHTML = `<input class="hl_o" list="dl_hho" placeholder="Outlet name or SAP code"><select class="hl_k">${S.hh.items.map((i) => `<option value="${i.key}">${h(i.label)} (${S.hh.stock[i.key] || 0})</option>`).join('')}</select><input class="hl_q" type="number" min="1" placeholder="Qty"><button class="btn sm" title="Remove" onclick="this.parentElement.remove()">✕</button>`;
  if (prev) { row.querySelector('.hl_k').value = prev.querySelector('.hl_k').value; row.querySelector('.hl_q').value = prev.querySelector('.hl_q').value; }
  box.appendChild(row);

async function saveHH() {

async function uploadBillFiles(id, inputId, kind) {

}
async function saveBill(id) {
  const A = ADMIN(), body = { callupNo: val('bl_cn'), callupDate: val('bl_cd'), billNo: val('bl_bn'), billDate: val('bl_bd'), amount: val('bl_am') || 0, description: val('bl_ds'), remarks: val('bl_rm'), jobIds: [...document.getElementById('bl_j').selectedOptions].map((o) => o.value), ...(A ? { vendorId: val('bl_v') } : {}) };
  const btn = document.getElementById('bl_go'); btn.disabled = true;
  try {
    const b = id ? await api('PATCH', '/api/bills/' + id, body) : await api('POST', '/api/bills', body);
    await uploadBillFiles(b.id, 'bl_f1', 'bill'); await uploadBillFiles(b.id, 'bl_f2', 'callup');
    if (A) {
      const cur = billsAll().find((x) => x.id === b.id) || b;
      const F = { SO: ['bl_so', 'bl_sod', 'bl_sob', 'soVerified'], RE: ['bl_re', 'bl_red', 'bl_reb', 'reVerified'] }, wantRel = chk('bl_rl');
      const op = async (who) => { const [cb, d, by, key] = F[who], want = chk(cb), has = !!cur[key]; if (want !== has || (want && (cur[key].on !== val(d) || cur[key].by !== (val(by) || cur[key].by)))) await api('POST', `/api/bills/${b.id}/verify`, { who, on: want, date: val(d), by: val(by) }); };
      if (!wantRel && cur.releasedOn) await api('POST', `/api/bills/${b.id}/release`, { on: false });   // undo release before changing verification
      if (!chk('bl_re') && cur.reVerified) await op('RE');                                                     // remove RE before SO
      await op('SO'); if (chk('bl_re')) await op('RE');                                                       // Sales Officer first, then RE team
      if (wantRel) await api('POST', `/api/bills/${b.id}/release`, { on: true, date: val('bl_rld'), amount: val('bl_rla'), force: chk('bl_force') });
    }
    toast('Bill saved'); closeModal(); await refresh(); if (OPEN_JOB && document.getElementById('modal')) drawJob();
  } catch (e) { toast(e.message, true); btn.disabled = false; }
}
async function delBillFile(bid, fid) { if (!confirm('Remove this file?')) return; const r = await act(() => api('DELETE', `/api/bills/${bid}/files/${fid}`)); if (r) { await reload(); editBill(bid); } }
async function delBill(id) { if (!confirm('Delete this bill record and its files?')) return; const r = await act(() => api('DELETE', '/api/bills/' + id), 'Deleted'); if (r) { closeModal(); refresh(); } }

   <div class="field"><label>Permit type</label><select id="wp_t" onchange="document.getElementById('wp_tx').style.display=this.value==='Other'?'block':'none'">${opts([['', '— select —'], ['Issued by officer', 'Issued by officer'], ['Issued by dealer', 'Issued by dealer'], ['Other', 'Other (write below)']], p.type || '')}</select></div><div class="field"><label>Permit no. / reference</label><input id="wp_r" value="${h(p.ref || '')}"></div></div>

}
async function savePermit(id) {
  const r = await act(() => api('POST', `/api/jobs/${id}/permit`, { status: val('wp_s'), date: val('wp_d'), ref: val('wp_r'), type: val('wp_t'), typeText: val('wp_o') }), 'Work permit updated');
  if (r) { closeModal(); await refresh(); if (OPEN_JOB === id) drawJob(); }
}
const permitWarn = (j) => (j.permit?.status === 'Issued' ? '' : `<div class="small" style="margin-bottom:8px;color:var(--amber)">⚠ Work permit not issued yet${S.settings.permitRequired === 'block' ? ' — deployment is blocked until it is issued' : ''}.</div>`);
const layoutWarn = (j) => (j.type !== 'DU_REPLACEMENT' || fileOf(j, 'layout').length ? '' : `<div class="small" style="margin-bottom:8px;color:var(--amber)">⚠ No approved layout uploaded — the deployment mail will go without it.</div>`);

const CAB_PILL = { Completed: 'green', 'In progress': 'blue', Incomplete: 'red', 'Not required': '' };
function layoutBlock(j) {
  if (j.type !== 'DU_REPLACEMENT') return '';
  return `<div class="callout" style="margin:8px 0;padding:10px 14px;background:var(--grey-soft);border-color:var(--line)"><div class="row" style="justify-content:space-between"><span>${ic('layout', 'sm')} <b>Approved layout</b> ${fileOf(j, 'layout').length ? '<span class="pill green">uploaded</span>' : '<span class="pill amber">pending</span>'}</span><span class="small muted">Attached automatically to the deployment mail</span></div>
    <div style="margin-top:6px">${jobFileChips(j, 'layout', ADMIN()) || '<span class="small muted">Not uploaded yet</span>'}</div>${ADMIN() && j.stage !== 'closed' ? `<div class="row" style="margin-top:6px"><input type="file" id="kf_layout" accept="image/*,application/pdf" multiple style="max-width:260px" onchange="uploadKind('layout')"><span class="small muted">PDF or image of the approved layout</span></div>` : ''}</div>`;
}
function cablingBlock(j) {
  if (j.type !== 'DU_REPLACEMENT' || !j.cabling || j.cabling === 'N/A') return '';
  const st = j.cablingStatus || (j.cabling === 'Required' ? 'Incomplete' : 'Not required'), open = j.cabling === 'Required' && st !== 'Completed' && sIdx(j) < sIdx(j, 'commissioned') && j.stage !== 'closed';
  return `<div class="callout" style="margin:8px 0;padding:10px 14px;background:var(--grey-soft);border-color:var(--line)"><div class="row" style="justify-content:space-between"><span>${ic('cableauto', 'sm')} <b>Automation cabling</b> <span class="pill ${CAB_PILL[st] ?? ''}">${h(st)}</span> <span class="small muted">${j.cabling === 'Required' ? 'required before commissioning' : h(j.cablingReason || '')}</span></span>
    ${open ? `<span class="row"><button class="btn sm" onclick="setCabling('${j.id}','In progress')">In progress</button><button class="btn sm" onclick="setCabling('${j.id}','Incomplete')">Incomplete</button>${ADMIN() ? `<button class="btn sm" onclick="setCabling('${j.id}','Not required')">Not required</button>` : ''}</span>` : ''}</div>${open ? '<div class="small muted" style="margin-top:4px">“Completed” is recorded when you submit the “Automation cabling completed” step below.</div>' : ''}</div>`;
}
async function setCabling(id, status) { const r = await act(() => api('POST', `/api/jobs/${id}/cabling`, { status }), 'Cabling status updated'); if (r) { await refresh(); redrawJob(); } }
const AUTO_PILL = { Pending: '', 'In progress': 'blue', Integrated: 'green', 'Issue / not working': 'red', 'Not applicable': '' };
const autoPill = (j) => (j.type === 'DU_REPLACEMENT' && j.automation && j.automation.status !== 'Pending' && j.automation.status !== 'N/A' ? `<span class="pill ${AUTO_PILL[j.automation.status] ?? ''}" title="Automation integration">${ic('plug', 'xs')} ${h(j.automation.status)}</span>` : '');
function automationBlock(j) {
  if (j.type !== 'DU_REPLACEMENT') return '';
  const a = j.automation || { status: 'Pending' }, canEdit = ADMIN() || jobVendor(j) === S.me.vendorId, after = sIdx(j) >= sIdx(j, 'installed');
  return `<div class="callout" style="margin:8px 0;padding:10px 14px;background:var(--grey-soft);border-color:var(--line)"><div class="row" style="justify-content:space-between"><span>${ic('plug', 'sm')} <b>Automation integration</b> <span class="pill ${AUTO_PILL[a.status] ?? ''}">${h(a.status)}</span>${a.date && a.status !== 'Pending' ? ` <span class="small muted">${fd(a.date)} · ${h(a.by || '')}</span>` : ''}</span></div>
    ${a.note ? `<div class="small muted">${h(a.note)}</div>` : ''}${canEdit && j.stage !== 'closed' || canEdit && ADMIN() ? `<div class="row" style="margin-top:8px"><select id="au_s" style="width:auto">${opts(['Pending', 'In progress', 'Integrated', 'Issue / not working', 'Not applicable'].map((x) => [x, x]), a.status)}</select><input id="au_n" placeholder="note (optional)" style="flex:1;min-width:140px"><button class="btn sm" onclick="saveAutomation('${j.id}')">Update</button></div>${after ? '' : '<div class="small muted" style="margin-top:4px">Normally updated after the new DU is installed.</div>'}` : ''}</div>`;
}
async function saveAutomation(id) { const r = await act(() => api('POST', `/api/jobs/${id}/automation`, { status: val('au_s'), note: val('au_n') }), 'Automation status updated'); if (r) { await refresh(); redrawJob(); } }
function jobBills(j) {
  const l = billsAll().filter((b) => (b.jobIds || []).includes(j.id));
  return `<div class="callout" style="margin:8px 0;padding:10px 14px;background:var(--grey-soft);border-color:var(--line)"><div class="row" style="justify-content:space-between"><span>${ic('rupee', 'sm')} <b>Billing</b> <span class="small muted">${l.length ? l.length + ' bill(s) linked' : 'no bill linked yet'}</span></span><button class="btn sm" onclick="editBill(null,'${j.id}')">+ Add bill</button></div>
    ${l.map((b) => `<div class="small" style="margin-top:6px"><a href="#" onclick="editBill('${b.id}');return false"><b>${h(b.no)}</b></a> · ${inrf(b.amount)} · <span class="pill ${billStatus(b)[1]}">${billStatus(b)[0]}</span></div>`).join('')}</div>`;
}
const jobExtras = (j) => permitBlock(j) + layoutBlock(j) + cablingBlock(j) + automationBlock(j) + jobBills(j);
</script>
<script>/* features5.js */

};
const DASH_WIDGETS = {
  map: { label: 'Live site map', desc: 'Outlets coloured by sales area with progress', w: 8, render: () => `<div class="card"><h2>Live site map <a class="small" href="#map">Open full map →</a></h2>${mapLegend()}<div id="map_dash" class="mapbox sm"></div></div>` },

  setup: { label: 'Getting started checklist', desc: 'What still needs to be filled in', w: 4, admin: true, render: () => {
    const it = SETUP(), done = it.filter((x) => x.ok).length; if (done === it.length) return '';
    return `<div class="card setup"><h2>Getting started <span class="pill ${done === it.length ? 'green' : 'amber'}">${done}/${it.length}</span></h2>${bar(Math.round((done / it.length) * 100), 'var(--green)')}<ul class="checks">${it.map((x) => `<li class="${x.ok ? 'ok' : ''}"><span class="ck">${x.ok ? ic('check') : ''}</span><span>${h(x.label)}</span>${x.ok ? '' : `<a class="btn sm" href="${x.href}" onclick="${x.after || ''}">Fix</a>`}</li>`).join('')}</ul></div>`; } },
  areas: { label: 'Progress by sales area', desc: 'Average progress, jobs in field, suction DUs left', w: 6, render: () => {
    const st = S.assetStats, rows = salesAreas().map((a) => { const js = S.jobs.filter((j) => outlet(j.outletCode).salesArea === a); return { a, n: js.length, avg: js.length ? Math.round(js.reduce((s, j) => s + pct(j), 0) / js.length) : 0, field: js.filter((j) => j.teamId && sIdx(j) >= sIdx(j, 'deployed') && !finished(j)).length, done: js.filter(finished).length, suc: st?.byArea?.[a] }; }).filter((x) => x.n || x.suc);
    return `<div class="card"><h2>Progress by sales area</h2>${rows.map((x) => `<div class="arow"><span class="an">${dot(areaColor(x.a))}${h(x.a)}</span>${bar(x.avg, areaColor(x.a))}<b>${x.avg}%</b><span class="small muted">${x.n} jobs · ${x.field} in field · ${x.done} done${x.suc != null ? ` · ${x.suc} suction DUs left` : ''}</span></div>`).join('') || '<div class="empty">No jobs yet</div>'}</div>`; } },
  pipeline: { label: 'DU replacement pipeline', desc: 'Jobs at each stage', w: 6, render: () => {

  automation: { label: 'Automation integration', desc: 'Status of replaced DUs', w: 4, render: () => {
    const rj = replacedJobs(), cnt = {}; rj.forEach((j) => (cnt[j.automation?.status || 'Pending'] = (cnt[j.automation?.status || 'Pending'] || 0) + 1));
    const cols = { Integrated: 'var(--green)', 'In progress': 'var(--blue-2)', 'Issue / not working': 'var(--red)', Pending: '#94a3b8', 'Not applicable': '#cbd5e1' }, ig = cnt.Integrated || 0;
    return `<div class="card"><h2>${ic('plug', 'sm')} Automation integration</h2><div class="bigline"><b>${ig}</b><span>of ${rj.length} replaced DU jobs integrated</span></div>${rj.length ? bar(Math.round((ig / rj.length) * 100), 'var(--green)') : ''}<div class="mini">${Object.entries(cols).map(([k, c]) => `<div><i style="background:${c}"></i>${k}<b>${cnt[k] || 0}</b></div>`).join('')}</div></div>`; } },
  cabling: { label: 'Automation cabling', desc: 'Completed / in progress / incomplete', w: 4, render: () => {

const PAGES = [['Monitoring dashboard', 'dash'], ['Live map', 'map'], ['Jobs', 'jobs'], ['Timeline', 'timeline'], ['Inventory', 'inventory'], ['Hanging hardware', 'hardware'], ['Installed DUs', 'assets'], ['Scrap', 'scrap'], ['Billing', 'billing'], ['Vendors & Teams', 'teams'], ['Outlets', 'outlets'], ['Mail log', 'emails'], ['Settings', 'settings']];
function openSearch() {
  document.getElementById('cmdk')?.remove();
  const o = document.createElement('div'); o.id = 'cmdk'; o.className = 'overlay center';
  o.innerHTML = `<div class="panel cmd"><div class="cin">${ic('search')}<input id="cmd_q" placeholder="Type an outlet name, SAP code, job ref (DU-0012) or page…" autocomplete="off"></div><div id="cmd_r" class="cres"></div><div class="chint"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div>`;
  o.addEventListener('mousedown', (e) => { if (e.target === o) o.remove(); }); document.body.appendChild(o);
  const q = document.getElementById('cmd_q'); let items = [], sel = 0;
  const draw = () => {
    const t = q.value.trim().toLowerCase(), words = t.split(/\s+/).filter(Boolean); items = [];
    const match = (s) => words.every((w) => s.includes(w));
    PAGES.filter(([l]) => !words.length || match(l.toLowerCase())).filter(([, k]) => ADMIN() || ['dash', 'map', 'jobs', 'timeline', 'scrap', 'billing', 'settings'].includes(k)).slice(0, words.length ? 4 : 13).forEach(([l, k]) => items.push({ ic: 'spark', t: l, s: 'Page', go: () => (location.hash = '#' + k) }));
    if (words.length) {
      S.jobs.filter((j) => match(`${j.ref} ${outlet(j.outletCode).name} ${j.outletCode}`.toLowerCase())).slice(0, 6).forEach((j) => items.push({ ic: 'jobs', t: `${j.ref} · ${outlet(j.outletCode).name}`, s: `${TYPE[j.type]} · ${sLabel(j)} · ${pct(j)}%`, go: () => openJob(j.id) }));
      S.outlets.filter((x) => match(`${x.code} ${x.name} ${x.district} ${x.dealerName || ''} ${x.dealerPhone || ''}`.toLowerCase())).slice(0, 6).forEach((x) => items.push({ ic: 'store', t: `${x.name}`, s: `${x.code} · ${x.district || ''} · ${x.salesArea || ''}`, go: () => { const j = S.jobs.find((y) => y.outletCode === x.code && y.stage !== 'closed') || S.jobs.find((y) => y.outletCode === x.code); if (j) openJob(j.id); else if (ADMIN()) editOutlet(x.code); } }));
      (S.bills || []).filter((b) => match(`${b.no} ${b.billNo} ${b.callupNo}`.toLowerCase())).slice(0, 3).forEach((b) => items.push({ ic: 'rupee', t: `${b.no} · ${vendorName(b.vendorId)}`, s: billStatus(b)[0], go: () => editBill(b.id) }));
    }
    sel = Math.min(sel, Math.max(0, items.length - 1));
    document.getElementById('cmd_r').innerHTML = items.map((x, i) => `<div class="cr ${i === sel ? 'on' : ''}" data-i="${i}">${icx(x.ic)}<div><b>${h(x.t)}</b><small>${h(x.s)}</small></div></div>`).join('') || '<div class="empty">Nothing found</div>';
  };
  const run = (i) => { const it = items[i]; if (!it) return; o.remove(); it.go(); };
  q.addEventListener('input', () => { sel = 0; draw(); });
  q.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter') run(sel); });
  document.getElementById('cmd_r').addEventListener('click', (e) => { const r = e.target.closest('.cr'); if (r) run(+r.dataset.i); });
  draw(); q.focus();
}
document.addEventListener('keydown', (e) => {
  if (!S) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) { e.preventDefault(); openSearch(); }
  else if (e.key === 'Escape') { const c = document.getElementById('cmdk'); if (c) c.remove(); else closeModal(); closeDD(); }
});

const MAP_LAYERS = () => {
  const esri = (p) => `https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
  return { Street: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }),
    Satellite: L.tileLayer(esri('World_Imagery'), { maxZoom: 19, attribution: 'Tiles © Esri' }),
    Hybrid: L.layerGroup([L.tileLayer(esri('World_Imagery'), { maxZoom: 19, attribution: 'Tiles © Esri' }), L.tileLayer(esri('Reference/World_Boundaries_and_Places'), { maxZoom: 19 })]),
    Terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, subdomains: 'abc', attribution: '© OpenStreetMap, SRTM | © OpenTopoMap' }),
    Light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' }),
    Dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' }) };
};
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } }, lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } };
async function buildMap(id) {
  const tok = ++MAPTOK, el = document.getElementById(id); if (!el) return null;
  let kind; try { kind = await ensureMapLib(); } catch (e) { el.innerHTML = `<div class="empty">${h(e.message)}</div>`; return null; }
  const el2 = document.getElementById(id); if (!el2 || tok !== MAPTOK) return null; el2.innerHTML = '';
  const m = { kind, lines: [], els: {}, id }; MAPOBJ = m;
  if (kind === 'g') m.map = new google.maps.Map(el2, { center: { lat: 23.2, lng: 79.9 }, zoom: 7, streetViewControl: false, fullscreenControl: true, mapTypeControl: true, mapTypeId: lsGet('ret_gmtype') || 'roadmap', mapTypeControlOptions: { mapTypeIds: ['roadmap', 'satellite', 'hybrid', 'terrain'] } });
  else {
    m.map = L.map(el2).setView([23.2, 79.9], 7); const base = MAP_LAYERS(), pick = base[lsGet('ret_maplayer')] ? lsGet('ret_maplayer') : 'Street';
    base[pick].addTo(m.map); L.control.layers(base, null, { position: 'topright' }).addTo(m.map); m.map.on('baselayerchange', (e) => lsSet('ret_maplayer', e.name));
  }
  if (kind === 'g') m.map.addListener('maptypeid_changed', () => lsSet('ret_gmtype', m.map.getMapTypeId()));
  const zoomOf = () => (kind === 'g' ? m.map.getZoom() : m.map.getZoom()), lbl = () => el2.classList.toggle('lbl', (zoomOf() || 0) >= 9);
  if (kind === 'g') m.map.addListener('zoom_changed', lbl); else m.map.on('zoomend', lbl);
  setTimeout(lbl, 0); m.updLabels = lbl;
  m.add = (lat, lng, elm, click, key) => {
    const sz = elm.classList.contains('dot') ? 14 : 40; m.els[key] = elm;
    if (kind === 'g') { new HtmlMarker({ lat, lng }, elm).setMap(m.map); elm.addEventListener('click', click); }
    else L.marker([lat, lng], { icon: L.divIcon({ html: elm, className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2] }) }).addTo(m.map).on('click', click);
  };
  m.fit = (ll) => {
    const v = MAPVIEW && MAPVIEW.id === id ? MAPVIEW : null;
    if (kind === 'g') {
      if (v) { m.map.setCenter({ lat: v.lat, lng: v.lng }); m.map.setZoom(v.z); } else if (ll.length) { const b = new google.maps.LatLngBounds(); ll.forEach(([a, c]) => b.extend({ lat: a, lng: c })); m.map.fitBounds(b, 50); }
      m.map.addListener('idle', () => { const c = m.map.getCenter(); MAPVIEW = { id, lat: c.lat(), lng: c.lng(), z: m.map.getZoom() }; });
    } else {
      if (v) m.map.setView([v.lat, v.lng], v.z); else if (ll.length) m.map.fitBounds(L.latLngBounds(ll).pad(0.2));
      m.map.on('moveend', () => { const c = m.map.getCenter(); MAPVIEW = { id, lat: c.lat, lng: c.lng, z: m.map.getZoom() }; });
    }
  };
  return m;
}

/* ---------- New job: pick the DUs (or STPs) installed at the outlet that are to be replaced ---------- */
const UNITS = { on: false };
function bindUnits(job) {
  UNITS.on = false; const inp = document.getElementById('e_out'); if (!inp) return;
  const run = () => showUnits(codeFromLabel(inp.value), job);
  inp.addEventListener('input', run); inp.addEventListener('change', run); document.getElementById('e_type')?.addEventListener('change', run);
  run();
}
async function showUnits(code, job) {
  const box = document.getElementById('e_assets'); if (!box) return;
  const o = S.outlets.find((x) => x.code === code);
  if (!o) { UNITS.on = false; box.innerHTML = '<div class="small muted" style="padding:8px 0">Pick an outlet above to see the units installed there and choose which to replace.</div>'; return; }

  if (codeFromLabel(document.getElementById('e_out')?.value) !== code) return; // user already picked another outlet
  const type = document.getElementById('e_type')?.value || job?.type, kind = type === 'STP_REPLACEMENT' ? 'STP' : 'DU', [y0, y1] = legacyRange();
  const inJob = new Map(); for (const j of S.jobs) if (j.stage !== 'closed' && j.id !== job?.id) (j.assetIds || []).forEach((id) => inJob.set(id, j));
  const mine = new Set(job?.assetIds || []);

  const sus = list.filter((a) => a.pumpType === 'Suction').length;
  const exJob = !job && type === 'DU_REPLACEMENT' ? S.jobs.find((j) => j.type === 'DU_REPLACEMENT' && j.outletCode === code && j.stage !== 'closed') : null;
  box.innerHTML = (exJob ? `<div class="callout warn small" style="margin-bottom:8px">This outlet already has an open DU replacement job <b>${h(exJob.ref)}</b> (${(exJob.assetIds || []).length} DU). <b>One job per outlet:</b> the DUs you tick will be added to ${h(exJob.ref)} instead of creating a new job.</div>` : '') + `<div class="callout" style="padding:12px 14px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${kind}s installed at ${h(o.name)}</b><span class="small muted">${list.length} unit(s) · ${sus} suction · ${list.length - sus} other${removedHere ? ` · ${removedHere} already removed` : ''}</span></div>
    <div class="small muted" style="margin-bottom:8px">Tick the unit(s) to be replaced in this job. The quantities below fill in automatically.</div>
    <div class="row" style="margin-bottom:8px"><button type="button" class="btn sm" onclick="unitsPick('suction')">Select all suction</button><button type="button" class="btn sm" onclick="unitsPick('legacy')">Select ${y0}–${y1} suction</button><button type="button" class="btn sm" onclick="unitsPick('none')">Clear</button></div>
    <div class="tbl-wrap" style="max-height:230px;overflow:auto"><table><thead><tr><th></th><th>Serial</th><th>Make · model</th><th>Nozzles</th><th>Year</th><th>Type</th></tr></thead><tbody>${list.map((a) => {
      const other = inJob.get(a.id), leg = a.pumpType === 'Suction' && a.year >= y0 && a.year <= y1;
      return `<tr class="${other ? 'dim' : ''}"><td><input type="checkbox" class="e_as" value="${a.id}" data-n="${a.nozzles || ''}" data-s="${a.pumpType === 'Suction' ? 1 : 0}" data-y="${a.year || ''}" data-ser="${h(a.serial)}" ${mine.has(a.id) ? 'checked' : ''} ${other ? 'disabled' : ''} onchange="unitsChanged()" style="width:auto"></td>
        <td class="mono">${h(a.serial)}</td><td class="small">${h(a.make)}<br><span class="muted">${h(a.model)}</span></td><td>${a.nozzles ?? ''}</td><td>${a.year ?? ''}${leg ? ' <span class="pill red">legacy</span>' : ''}</td>
        <td>${other ? `<span class="pill amber">in ${h(other.ref)}</span>` : a.pumpType ? `<span class="pill ${a.pumpType === 'Suction' ? 'red' : 'green'}">${a.pumpType}</span>` : '<span class="pill">?</span>'}</td></tr>`;
    }).join('')}</tbody></table></div><div class="small" id="e_as_sum" style="margin-top:8px"></div></div>`;

function unitsPick(mode) {

function unitsChanged(initial) {

const REC_LOOK = { ms_hose: ['hose', '#f97316', 'MS'], hsd_hose: ['hose', '#b45309', 'HSD'], swivel: ['swivel', '#2563eb', ''], metering: ['meter', '#7c3aed', ''], nozzle: ['nozzle', '#dc2626', ''], breakaway: ['breakaway', '#0d9488', ''], other: ['other', '#64748b', ''] };

async function addRecovered() {

  const inp = document.getElementById('rc_o');

/* ---------- go ---------- */
boot();

<script>/* features6.js */

/* ---------- receive stock: serials, make, nozzles / HP, date, store ---------- */
const STP_HP = () => S.settings.hpOptions || ['0.75', '1.5'];

function rsKind() { const du = val('s_kind') === 'DU'; document.getElementById('s_noz_w').style.display = du ? '' : 'none'; document.getElementById('s_hp_w').style.display = du ? 'none' : ''; }

<script>/* features7.js */
/* Features layer 7: PCU + CVT/Stabilizer scrap types, Sales Officer scrap reports (read → review → register),
   admin edit of scrap items, admin delete of stock lines. Loaded after features6.js. */
ICO2.pcu = '<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M13 7l-3.5 5.5h4L10 17"/>';
ICO2.cvt = '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6.5 12h2.2l1.4-3 3 6 1.4-3h3"/>';

/* ---------- category guessing from free text ---------- */
const SCRAP_RULES = [['Canopy lights', /canopy\s*(light|lamp|fixture|luminaire)/i], ['Yard lights', /yard\s*light|flood\s*light|street\s*light|pole\s*light|high\s*mast/i],
  ['Automation cable', /automation|data\s*cable|communication\s*cable|cat\s*-?\s*6|lan\s*cable|ethernet/i], ['PCU', /\bpcu\b|power\s*(conditioning|control)\s*unit/i],
  ['CVT/Stabilizer', /\bcvt\b|stabili[sz]er|voltage\s*(regulator|corrector)/i], ['Electrical panel', /panel|\bmcb\b|\bdb\b|distribution\s*board|switch\s*gear|feeder\s*pillar/i],
  ['Nozzles', /nozzle/i], ['Hosepipes', /hose/i], ['Scrap DUs', /dispensing\s*unit|dispenser|\bdus?\b|\bmpd\b/i], ['Tanks', /\btanks?\b|underground\s*tank/i],
  ['Pipeline & fittings', /pipe|fitting|valve|elbow|flange|\btee\b|coupling/i], ['Canopy', /canopy/i], ['RVI', /\brvi\b|totem|fascia|signage|sign\s*board|price\s*board/i],
  ['Hoarding', /hoarding|banner|\bflex\b|display\s*board/i], ['Cables', /cable|wire/i]];
const guessCategory = (t) => (SCRAP_RULES.find(([, re]) => re.test(t || '')) || ['Other items'])[0];
const typeFromText = (t) => SCRAP_TYPES.find((x) => x.k.toLowerCase() === String(t || '').trim().toLowerCase())?.k;
function matchOutletText(s) {
  s = String(s || ''); const m = s.match(/\b(4\d{7})\b/); if (m && S.outlets.find((o) => o.code === m[1])) return m[1];
  const u = s.toUpperCase().replace(/\s+/g, ' ').trim(); if (u.length < 5) return '';
  const hit = S.outlets.filter((o) => o.name && (u.includes(o.name.toUpperCase()) || (u.length > 8 && o.name.toUpperCase().includes(u))));
  return hit.length === 1 ? hit[0].code : '';
}
const qtyFrom = (s) => { s = String(s || ''); const m = s.match(/(?:qty|quantity|nos?\.?)\s*[:\-=]?\s*(\d{1,4})\b/i) || s.match(/\b(\d{1,3})\s*(?:nos?\.?|pcs|units?|sets?|lots?)\b/i); return m ? +m[1] : 0; };

/* ---------- read a report into rows ---------- */
function rowsFromSheets(sheets, defOut) {
  const out = [];
  for (const sh of sheets) {
    const rows = sh.rows.filter((r) => r.some((c) => String(c).trim()));
    const hi = rows.slice(0, 25).findIndex((r) => r.some((c) => /item|description|material|particular|equipment/i.test(c)));
    if (hi < 0) { out.push(...rowsFromText(rows.map((r) => r.join('  ')).join('\n'), defOut)); continue; }
    const hd = rows[hi].map((c) => String(c)), col = (re, not) => hd.findIndex((c) => re.test(c) && !(not && not.test(c)));
    const ci = col(/item|description|material|particular|equipment/i), cq = col(/qty|quantity|nos|no\.? of|number/i, /^\s*(s|sr|sl)\.?\s*no/i), co = col(/sap|ro\s*code|outlet|ro\s*name|retail|location|site/i),
      cs = col(/serial|machine|s\/n/i, /^\s*(s|sr|sl)\.?\s*no/i), cc = col(/categor|type|head/i), cr = col(/remark|condition|note/i);
    for (const r of rows.slice(hi + 1)) {
      const name = String(r[ci] ?? '').trim(); if (!name) continue;
      const code = (co >= 0 && matchOutletText(r[co])) || matchOutletText(r.join(' ')) || defOut;
      out.push({ on: true, name: name.slice(0, 120), category: (cc >= 0 && typeFromText(r[cc])) || guessCategory(name + ' ' + (cc >= 0 ? r[cc] : '')), qty: Math.max(1, parseInt(r[cq]) || qtyFrom(r.join(' ')) || 1), outlet: code ? outletLabel(outlet(code)) : '', serial: cs >= 0 ? String(r[cs] || '').trim() : '', note: cr >= 0 ? String(r[cr] || '').trim() : '' });
    }
  }
  return out;
}
function rowsFromText(text, defOut) {
  const out = [];
  for (let line of String(text || '').split(/\r?\n/)) {
    line = line.replace(/\s+/g, ' ').trim(); if (line.length < 3) continue;
    const cat = guessCategory(line); if (cat === 'Other items') continue;           // only lines that clearly name a scrap item
    const code = matchOutletText(line) || defOut, name = line.replace(/^\(?\d{1,3}[.)]\s*/, '').slice(0, 120);
    out.push({ on: true, name, category: cat, qty: qtyFrom(line) || 1, outlet: code ? outletLabel(outlet(code)) : '', serial: '', note: '' });
  }
  return out;
}
async function pdfText(file) {
  if (!window.pdfjsLib) { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, lines = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 30); p++) {
    const tc = await (await pdf.getPage(p)).getTextContent(), by = new Map();
    for (const it of tc.items) { const y = Math.round(it.transform[5] / 3); if (!by.has(y)) by.set(y, []); by.get(y).push([it.transform[4], it.str]); }
    [...by.entries()].sort((a, b) => b[0] - a[0]).forEach(([, xs]) => lines.push(xs.sort((a, b) => a[0] - b[0]).map((x) => x[1]).join(' ')));
  }
  return lines.join('\n');
}

   <div class="field"><label>Sales Officer</label><input id="sr_so" list="dl_srso"><datalist id="dl_srso">${sos.map((n) => `<option value="${h(n)}">`).join('')}</datalist></div><div class="field"><label>Report date</label><input id="sr_d" type="date" value="${S.today}" max="${S.today}"></div>
   <div class="field"><label>Outlet (used when a row does not name one)</label><input id="sr_o" list="dl_sro" placeholder="Type outlet name or SAP code"><datalist id="dl_sro">${S.outlets.map((o) => `<option value="${h(outletLabel(o))}">`).join('')}</datalist></div><div class="field"><label>Note</label><input id="sr_n"></div></div>
   <button class="btn primary" id="sr_read" onclick="readReport()">Read report</button><div id="sr_rows" style="margin-top:14px"></div>`, { side: true });
}
async function readReport() {
  const f = document.getElementById('sr_f').files[0]; if (!f) return toast('Choose the report file', true);
  const defOut = codeFromLabel(val('sr_o')), ext = f.name.toLowerCase().split('.').pop(), btn = document.getElementById('sr_read');
