function drawSrepRows() {
  const box = document.getElementById('sr_rows'); if (!box || !SREP) return;
  const msg = SREP.how === 'sheet' || SREP.how === 'pdf' ? (SREP.found ? `<div class="callout small">Found <b>${SREP.found}</b> item(s) in the report. Check the category, quantity and outlet of each row; untick anything that is not scrap.</div>` : '<div class="callout warn small">No scrap items could be recognised in this file — enter them below.</div>')
    : '<div class="callout warn small">This file is a scan or photo, so it cannot be read automatically. Enter the items below — the report is saved with them.</div>';
  const n = SREP.rows.filter((r) => r.on && r.name.trim()).length;
  box.innerHTML = `${msg}<div class="tbl-wrap"><table class="srep"><thead><tr><th></th><th>Item</th><th>Category</th><th>Qty</th><th>Outlet</th><th>Serial</th><th>Note</th><th></th></tr></thead><tbody>${SREP.rows.map((r, i) => `<tr class="${r.on ? '' : 'dim'}">
    <td><input type="checkbox" ${r.on ? 'checked' : ''} onchange="SREP.rows[${i}].on=this.checked;drawSrepRows()" style="width:auto"></td>
    <td><input value="${h(r.name)}" oninput="SREP.rows[${i}].name=this.value;SREP.rows[${i}].category=SREP.rows[${i}].catSet?SREP.rows[${i}].category:guessCategory(this.value);"></td>
    <td><select onchange="SREP.rows[${i}].category=this.value;SREP.rows[${i}].catSet=true">${opts(SCRAP_TYPES.map((t) => [t.k, t.k]), r.category)}</select></td>
    <td><input type="number" min="1" value="${r.qty}" style="width:70px" oninput="SREP.rows[${i}].qty=this.value"></td>
    <td><input list="dl_sro" value="${h(r.outlet)}" oninput="SREP.rows[${i}].outlet=this.value;this.classList.toggle('need',!this.value)" placeholder="choose outlet" class="${r.outlet ? '' : 'need'}" title="${r.outlet ? '' : 'Outlet not found or ambiguous in the report — please choose'}"></td>
    <td><input value="${h(r.serial)}" oninput="SREP.rows[${i}].serial=this.value" style="width:110px"></td><td><input value="${h(r.note)}" oninput="SREP.rows[${i}].note=this.value"></td>
    <td><button class="btn sm" onclick="SREP.rows.splice(${i},1);drawSrepRows()" title="Remove row">✕</button></td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" onclick="SREP.rows.push(blankRow(codeFromLabel(val('sr_o'))));drawSrepRows()">+ Add row</button><span class="spacer"></span><button class="btn primary" id="sr_go" onclick="saveSrep()">Register ${n} item(s) as scrap</button></div>`;
}
async function saveSrep() {
  const items = SREP.rows.filter((r) => r.on && String(r.name).trim()).map((r) => ({ name: r.name, category: r.category, qty: r.qty, outletCode: codeFromLabel(r.outlet), serial: r.serial, note: r.note }));
  if (!items.length) return toast('Tick at least one item', true);
  const bad_ = items.findIndex((i) => !S.outlets.find((o) => o.code === i.outletCode)); if (bad_ >= 0) return toast(`Row "${items[bad_].name}": pick the outlet from the list`, true);
  const f = SREP.file, ext = f.name.toLowerCase().split('.').pop(), MIME = { pdf: 'application/pdf', csv: 'text/csv', xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
  const btn = document.getElementById('sr_go'); btn.disabled = true; btn.textContent = 'Registering…';
  try {
    const rep = await api('POST', '/api/scrap-reports', { name: f.name, mime: MIME[ext] || f.type, data: await readB64(f), soName: val('sr_so'), date: val('sr_d'), note: val('sr_n') });
    const r = await api('POST', '/api/scrap/bulk', { reportId: rep.id, items });
    toast(`${r.created} item(s) registered as scrap`); closeModal(); SREP = null; refresh();
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Register'; }
}
function scrapReportsCard() {
  const l = (S.scrapReports || []).slice().sort((a, b) => b.at.localeCompare(a.at)); if (!l.length) return '';
  return `<details class="card srep-card"><summary><b>📄 Scrap reports from Sales Officers</b> <span class="pill">${l.length}</span></summary><div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Sales Officer</th><th>Report</th><th class="right">Items registered</th><th></th></tr></thead><tbody>${l.map((r) => `<tr><td class="nowrap">${fd(r.date)}</td><td>${h(r.soName || '—')}${r.note ? `<div class="small muted">${h(r.note)}</div>` : ''}</td>
    <td><a href="/api/scrapreports/${r.id}?t=${encodeURIComponent(TOKEN)}" target="_blank" rel="noopener">${h(r.name)}</a></td><td class="right">${(r.itemIds || []).length}</td><td class="right">${S.me.role === 'admin' ? `<button class="btn sm danger" onclick="delSrep('${r.id}')">Delete</button>` : ''}</td></tr>`).join('')}</tbody></table></div></details>`;
}
async function delSrep(id) {
  const r = S.scrapReports.find((x) => x.id === id); if (!r || !confirm('Delete this report file?')) return;
  const items = (r.itemIds || []).length && confirm(`Also remove the ${(r.itemIds || []).length} scrap item(s) registered from it? (Cancel keeps them)`);
  const x = await act(() => api('DELETE', `/api/scrap-reports/${id}?items=${items ? 1 : 0}`), 'Report deleted'); if (x) refresh();
}

/* ---------- admin: edit any scrap item; delete stock lines ---------- */
function editScrap(id) {
  const x = S.scrap.find((y) => y.id === id); if (!x) return;
  modal(`<h1>Edit scrap item</h1><div class="field"><label>Type of scrap</label><div class="tpick">${SCRAP_TYPES.map((t) => `<label class="tp" style="--c:${t.color}"><input type="radio" name="es_t" value="${t.k}" ${scrapTypeOf(x).k === t.k ? 'checked' : ''}><span>${ic(t.icon)}<small>${h(t.k)}</small></span></label>`).join('')}</div></div>
   <div class="grid2"><div class="field"><label>Item name</label><input id="es_n" value="${h(x.name)}"></div><div class="field"><label>Quantity</label><input id="es_q" type="number" min="1" value="${x.qty}"></div>
   <div class="field"><label>Outlet</label><input id="es_o" list="dl_eso" value="${h(outletLabel(outlet(x.outletCode)))}"><datalist id="dl_eso">${S.outlets.map((o) => `<option value="${h(outletLabel(o))}">`).join('')}</datalist></div><div class="field"><label>Serial no.</label><input id="es_s" value="${h(x.serial || '')}"></div>
   <div class="field"><label>Status</label><select id="es_st">${opts([['At outlet', 'Lying at outlet'], ['Collected', 'Collected'], ['Disposed', 'Disposed']], x.status)}</select></div><div class="field"><label>Note</label><input id="es_no" value="${h(x.note || '')}"></div></div>
   <div class="row"><button class="btn primary" onclick="saveScrapEdit('${id}')">Save</button><button class="btn danger" onclick="delScrap('${id}')">Delete</button></div>`);
}
async function saveScrapEdit(id) {
  const code = codeFromLabel(val('es_o')); if (!S.outlets.find((o) => o.code === code)) return toast('Pick the outlet from the list', true);
  const q = Math.floor(+val('es_q')); if (!(q > 0)) return toast('Quantity must be at least 1', true);
  const r = await act(() => api('PATCH', '/api/scrap/' + id, { name: val('es_n'), category: document.querySelector('input[name=es_t]:checked')?.value, qty: q, outletCode: code, serial: val('es_s'), status: val('es_st'), note: val('es_no') }), 'Scrap item updated');
  if (r) { closeModal(); refresh(); }
}
async function delStock(id) {
  const r = S.stock.find((x) => x.id === id); if (!r || !confirm(`Delete the stock line "${r.model}" (${r.qty} on hand)? Its serial numbers are removed too.`)) return;
  const x = await act(() => api('DELETE', '/api/stock/' + id), 'Stock line deleted'); if (x) refresh();
}
</script>
<script>/* mobile.js */
/* Mobile / installable-app layer: service worker, install prompt (Android) and instructions (iOS),
   bottom tab bar + "More" sheet for phones, offline notice. Loaded last. */

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => { /* app still works without it */ }));
}

/* ---------- install ---------- */
let INSTALL_EVT = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isPhone = () => window.matchMedia('(max-width: 900px)').matches;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_EVT = e; drawInstallBar(); });
window.addEventListener('appinstalled', () => { INSTALL_EVT = null; document.getElementById('installbar')?.remove(); toast('App installed'); });
async function installApp() {
  if (INSTALL_EVT) { INSTALL_EVT.prompt(); await INSTALL_EVT.userChoice.catch(() => null); INSTALL_EVT = null; document.getElementById('installbar')?.remove(); return; }
  showInstallHelp();
}
function showInstallHelp() {
  const secure = location.protocol === 'https:' || location.hostname === 'localhost';
  modal(`<h1>Install on your phone</h1>
    ${isIOS() ? `<div class="callout"><b>iPhone / iPad (Safari)</b><ol class="small" style="margin:8px 0 0 18px;line-height:1.8"><li>Open this page in <b>Safari</b> (not inside another app).</li><li>Tap the <b>Share</b> button <span style="font-size:16px">⬆︎</span> at the bottom.</li><li>Scroll and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol></div>`
      : `<div class="callout"><b>Android (Chrome)</b><ol class="small" style="margin:8px 0 0 18px;line-height:1.8"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b>), then <b>Install</b>.</li></ol></div>`}
    ${secure ? '' : '<div class="callout warn small"><b>Tip:</b> this address is not HTTPS, so the phone may only add a shortcut. Once the site is hosted with HTTPS (or opened through a secure tunnel) it installs as a full app with its own icon, full-screen window and offline start-up.</div>'}
    <p class="small muted">After installing, open <b>RE Tracker</b> from the home screen like any other app.</p>`);
}
function drawInstallBar() {
  document.getElementById('installbar')?.remove();
  if (!S || !isPhone() || isStandalone() || lsGet('ret_install_dismiss') === '1') return;
  const bar = document.createElement('div'); bar.id = 'installbar'; bar.className = 'installbar';
  bar.innerHTML = `<img src="/icons/icon-192.png" alt=""><div><b>Install RE Tracker</b><small>${isIOS() ? 'Add it to your Home Screen for one-tap access' : 'Add it to your home screen — works like an app'}</small></div><button class="btn primary sm" onclick="installApp()">${INSTALL_EVT ? 'Install' : 'How?'}</button><button class="x" aria-label="Dismiss" onclick="lsSet('ret_install_dismiss','1');this.parentElement.remove()">✕</button>`;
  document.body.appendChild(bar);
}

/* ---------- offline notice ---------- */
function drawOffline() {
  let b = document.getElementById('offbar');
  if (navigator.onLine) { b?.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'offbar'; b.className = 'offbar'; document.body.appendChild(b); }
  b.textContent = 'You are offline — changes cannot be saved until you reconnect.';
}
window.addEventListener('online', () => { drawOffline(); toast('Back online'); }); window.addEventListener('offline', drawOffline);

/* ---------- bottom tab bar + More sheet (phones) ---------- */
function renderMobileNav() {
  document.getElementById('mnav')?.remove();
  if (!S) return;
  const v = view(), A = ADMIN(), tabs = A ? [['dash', 'Home', 'dash'], ['jobs', 'Jobs', 'jobs'], ['map', 'Map', 'map'], ['scrap', 'Scrap', 'trash']] : [['dash', 'Home', 'dash'], ['jobs', 'Jobs', 'jobs'], ['billing', 'Billing', 'rupee'], ['scrap', 'Scrap', 'trash']].filter(([k]) => S.settings.vendorMenu?.[k] !== false);
  const nav = document.createElement('nav'); nav.id = 'mnav'; nav.className = 'mnav'; nav.setAttribute('aria-label', 'Main');
  nav.innerHTML = tabs.map(([k, l, i]) => `<button class="${v === k ? 'on' : ''}" onclick="location.hash='#${k}'">${icx(i)}<span>${l}</span></button>`).join('') +
    `<button class="${tabs.some((t) => t[0] === v) ? '' : 'on'}" onclick="openMore()">${ic('other')}<span>More</span></button>`;
  document.body.appendChild(nav);
}
function openMore() {
  const items = (ADMIN() ? NAV_ADMIN : NAV_VENDOR), v = view();
  document.getElementById('msheet')?.remove();
  const o = document.createElement('div'); o.id = 'msheet'; o.className = 'overlay msheet';
  o.innerHTML = `<div class="sheet"><div class="grab"></div><div class="who"><b>${h(S.me.name)}</b><span class="muted small">${ADMIN() ? 'Admin' : h(vendor(S.me.vendorId)?.name || 'Vendor')}</span></div>
    <div class="sgrid">${items.filter((x) => x[0] !== '#').map(([k, l, i]) => `<button class="${v === k ? 'on' : ''}" onclick="document.getElementById('msheet').remove();location.hash='#${k}'">${ico(i)}<span>${l}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:14px">${isStandalone() ? '' : '<button class="btn" onclick="document.getElementById(\'msheet\').remove();installApp()">Install app</button>'}<button class="btn" onclick="openSearch();document.getElementById('msheet').remove()">Search</button><button class="btn danger" onclick="logout()">Sign out</button></div></div>`;
  o.addEventListener('mousedown', (e) => { if (e.target === o) o.remove(); }); document.body.appendChild(o);
}
const _renderTopbar = renderTopbar;
renderTopbar = function () {
  _renderTopbar(); renderMobileNav(); drawInstallBar(); drawOffline();
  document.body.classList.toggle('role-editor', !!S && S.me.role === 'editor');
  if (S && S.me.role === 'editor') document.querySelector('#topbar .tb-r')?.insertAdjacentHTML('afterbegin', '<span class="pill green" title="You can edit and publish but cannot delete records or change users and Settings">Editor</span>');
  if (S && VIEWER()) { document.querySelector('#topbar .tb-r .dd')?.remove(); document.querySelector('#topbar .tb-r')?.insertAdjacentHTML('afterbegin', '<span class="pill blue" title="You can look at everything but cannot change anything">View-only</span>'); }
};
</script>
